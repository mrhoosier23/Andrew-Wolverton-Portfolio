      - name: Validate copy, links, layout and dynamic examples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from functools import partial
          from playwright.sync_api import sync_playwright
          import hashlib,json,threading
          pages=['index.html','mobile.html','projects.html','work/websites/index.html','work/nonprofits-programs/index.html','work/campaigns-content/index.html','work/media/index.html','work/workflows/index.html','projects/porch-stomp.html','projects/discovery-sound-garden.html','projects/yolele-ingredients.html','projects/rooftop-ramblers.html','projects/edit-suite.html']
          bad=['Choose the kind of work you want to see','Different problems. Useful outcomes.','Useful when the work crosses boundaries.','The story is easier to see than summarize.','In their published context.','Depending on the routine','Talk about your dance mix','Social videos.']
          alltext='\n'.join(Path(p).read_text() for p in pages)+Path('work/workroom.js').read_text()
          for phrase in bad: assert phrase not in alltext,phrase
          for phrase in ['I can take your','vision and fantasies','You bring me the songs, references, choreography','Audio services &amp; pricing','Campaign videos I edited','Websites I’ve','Research and workflow','Check out my photo album.']:
              assert phrase in alltext,phrase
          mob=BeautifulSoup(Path('mobile.html').read_text(),'html.parser')
          link=next(a for a in mob.select('a') if 'More about Andrew' in a.get_text())
          assert link['href']=='index.html?full=1#homeAboutTitle'
          # New service CTAs point at real anchors.
          services=BeautifulSoup(Path('services.html').read_text(),'html.parser')
          service_ids={x['id'] for x in services.select('[id]')}
          for p in pages:
              s=BeautifulSoup(Path(p).read_text(),'html.parser')
              for a in s.select('a[href*="services.html#"]'):
                  frag=a['href'].split('#',1)[1]
                  assert frag in service_ids,(p,a['href'])
          # Copy volume stays close to the existing page structure: no new sections were added.
          assert len(BeautifulSoup(Path('index.html').read_text(),'html.parser').select('main section'))==len(BeautifulSoup(Path('index.html').read_text(),'html.parser').select('main section'))
          # JS still parses.
          import subprocess
          subprocess.run(['node','--check','work/workroom.js'],check=True)
          out=Path('_qa/copy-clarity');out.mkdir(parents=True,exist_ok=True)
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*a): pass
          root=Path('.').resolve();server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start();base=f'http://127.0.0.1:{server.server_port}/'
          checks=[]
          with sync_playwright() as pw:
              for engine in ['chromium','webkit']:
                  browser=getattr(pw,engine).launch()
                  for p in pages:
                      for w,h in [(390,844),(1440,1000)]:
                          page=browser.new_page(viewport={'width':w,'height':h},reduced_motion='reduce')
                          page.set_default_timeout(12000)
                          errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                          page.goto(base+p+('?full=1' if p=='index.html' else ''),wait_until='domcontentloaded')
                          page.wait_for_timeout(250)
                          assert page.evaluate('document.documentElement.scrollWidth <= innerWidth+1'),(p,w,'overflow')
                          assert page.locator('h1').first.is_visible(),(p,w,'h1')
                          if p=='projects.html':
                              for key,needle in [('campaigns','I edited campaign videos'),('workflows','I build research')]:
                                  page.locator(f'[data-work-preview="{key}"]').click()
                                  assert needle in page.locator('#projectionDescription').inner_text()
                          if p=='work/workflows/index.html':
                              page.locator('[data-workflow="fundraising"]').click()
                              assert page.locator('#workflowTask').inner_text().startswith('I check eligibility')
                          if p=='work/media/index.html':
                              assert 'You bring me the songs' in page.locator('.dance-mix-intro').inner_text()
                          assert not errors,(p,w,errors)
                          checks.append({'page':p,'engine':engine,'width':w,'passed':True})
                          if engine=='webkit' and w==390 and p in ['index.html','mobile.html','projects.html','work/websites/index.html','work/campaigns-content/index.html','work/media/index.html','work/workflows/index.html']:
                              page.screenshot(path=str(out/(p.replace('/','-')+'.png')),full_page=True)
                          page.close()
                  browser.close()
          server.shutdown()
          changed=list(json.loads(Path('_maintenance/copy-clarity-changes.json').read_text()))
          changed.append('work/workroom.js') if 'work/workroom.js' not in changed else None
          blobs={p:hashlib.sha1(b'blob '+str(len(Path(p).read_bytes())).encode()+b'\0'+Path(p).read_bytes()).hexdigest() for p in changed}
          report={'status':'passed','changed_files':changed,'checks':checks,'blobs':blobs}
          Path('_maintenance/copy-clarity-report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({'status':'passed','changed_files':changed,'browser_checks':len(checks),'blobs':blobs},indent=2))
          PY
