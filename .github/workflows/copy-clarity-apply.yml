          changes={}
          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              found=text.count(old)
              assert found==count, f'{path}: expected {count} copy of {old!r}, found {found}'
              text=text.replace(old,new,count)
              p.write_text(text)
              changes.setdefault(path,[]).append({'old':old,'new':new})
          
