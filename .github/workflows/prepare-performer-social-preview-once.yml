name: Prepare performer social preview once
on:
  push:
    branches: [prepare/performer-social-preview-20261002]
    paths: [.github/workflows/prepare-performer-social-preview-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/prepare/performer-social-preview-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            performer.html
            assets/performer
          sparse-checkout-cone-mode: false
      - name: Install image converter
        run: python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==11.3.0
      - name: Convert the existing approved portrait and update only social metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha1
          from html.parser import HTMLParser
          from PIL import Image
          def blob_hash(data):
              return sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          source = Path('assets/performer/mrhoosier-portrait.avif')
          page = Path('performer.html')
          assert blob_hash(source.read_bytes()) == 'f26706e0ff3713e90e9e6049c44a572d7b1bc072', 'Portrait source changed; review before proceeding.'
          assert blob_hash(page.read_bytes()) == 'ac76bb5155e05dcb180c818b3caacef6b0769a4b', 'Page changed; review before proceeding.'
          output = Path('assets/performer/mrhoosier-social-preview-20261002.png')
          assert not output.exists(), 'Do not overwrite an existing image.'
          with Image.open(source) as image:
              rgb = image.convert('RGB')
              width, height = rgb.size
              assert (width, height) == (800, 800)
              rgb.save(output, format='PNG', optimize=True)
          with Image.open(output) as check:
              check.verify()
          assert output.stat().st_size < 5000000
          html = page.read_text(encoding='utf-8')
          url = 'https://www.awolverton.com/assets/performer/mrhoosier-social-preview-20261002.png'
          alt = 'Andrew Wolverton with a guitar and microphone, framed by the red-and-cream MrHoosier wordmark'
          old = '  <meta property="og:image" content="https://www.awolverton.com/assets/Headshot%20Option%202.jpg">\n  <meta property="og:image:alt" content="Andrew Wolverton">'
          assert html.count(old) == 1
          new = '\n'.join([
              f'  <meta property="og:image" content="{url}">',
              f'  <meta property="og:image:secure_url" content="{url}">',
              '  <meta property="og:image:type" content="image/png">',
              f'  <meta property="og:image:width" content="{width}">',
              f'  <meta property="og:image:height" content="{height}">',
              f'  <meta property="og:image:alt" content="{alt}">',
          ])
          updated = html.replace(old, new, 1)
          card = '  <meta name="twitter:card" content="summary_large_image">'
          assert updated.count(card) == 1 and 'name="twitter:image"' not in updated
          updated = updated.replace(card, card + '\n' + '\n'.join([
              '  <meta name="twitter:title" content="Mr. Hoosier | Andrew Wolverton">',
              '  <meta name="twitter:description" content="Broadway, bluegrass, and everything in between. Watch the live playlist, follow the music, and book a show.">',
              f'  <meta name="twitter:image" content="{url}">',
              f'  <meta name="twitter:image:alt" content="{alt}">',
          ]), 1)
          assert html.split('</head>', 1)[1] == updated.split('</head>', 1)[1], 'Visible page must remain unchanged.'
          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.tags = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'meta': self.tags.append(dict(attrs))
          parser = MetaParser(); parser.feed(updated)
          for attribute, key in [('property', 'og:image'), ('name', 'twitter:image')]:
              matching = [tag for tag in parser.tags if tag.get(attribute) == key]
              assert len(matching) == 1 and matching[0]['content'] == url
          page.write_text(updated, encoding='utf-8')
          print('IMAGE', output, width, height, output.stat().st_size, blob_hash(output.read_bytes()))
          print('HTML', blob_hash(page.read_bytes()))
          print('CHECK: visible page unchanged; one Open Graph image and one Twitter image; PNG verified.')
          PY
      - name: Save prepared files on this branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add performer.html assets/performer/mrhoosier-social-preview-20261002.png
          git diff --cached --check
          git commit -m 'Prepare Mr. Hoosier social preview image and metadata'
          git push origin HEAD:refs/heads/prepare/performer-social-preview-20261002
          git ls-files --stage performer.html assets/performer/mrhoosier-social-preview-20261002.png
