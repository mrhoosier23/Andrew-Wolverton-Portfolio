name: Services page feedback validation
on:
  push:
    branches: [services-layout-20260916]
    paths: ['_maintenance/services-v4-*', '.github/workflows/services-v3.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install browser test tools
        run: |
          python3 -m pip install beautifulsoup4 playwright pillow > /tmp/install.log 2>&1 || { cat /tmp/install.log; exit 1; }
          python3 -m playwright install --with-deps chromium webkit >> /tmp/install.log 2>&1 || { cat /tmp/install.log; exit 1; }
      - name: Build and revise the Services draft only
        run: |
          python3 _maintenance/services-v3-build.py
          python3 _maintenance/services-v4-refine.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_maintenance/services-v4-qa.py')
          lines=p.read_text().splitlines()
          assert sum('assert summary.evaluate(' in line for line in lines)==1
          lines=["     assert summary.evaluate('e=>[\"::before\",\"::after\"].every(p=>getComputedStyle(e,p).display===\"none\")')" if 'assert summary.evaluate(' in line else line for line in lines]
          p.write_text('\n'.join(lines)+'\n')
          PY
      - name: Test prices, process, FAQs, tools, portrait, links and contact form
        run: python3 _maintenance/services-v4-qa.py
      - name: Save validated draft and test report to review branch only
        run: |
          cp _qa/services-v4/report.json _maintenance/services-v4-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services.html services-page.css _maintenance/services-v4-report.json _maintenance/services-v4-qa.py
          git commit -m 'Revise Services draft with displayed rates, full process cards and checked mobile controls'
          git push origin HEAD:services-layout-20260916
      - name: Save complete page and section previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-v4-qa
          path: _qa/services-v4/
          retention-days: 7
