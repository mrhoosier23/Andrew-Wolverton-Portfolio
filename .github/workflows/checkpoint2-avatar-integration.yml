name: Checkpoint 2 avatar format cleanup
on:
  push:
    branches: [copy-clarity-20260916]
    paths: ['.github/workflows/checkpoint2-avatar-integration.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy-clarity-20260916
          fetch-depth: 0
      - run: python3 -m pip install --quiet pillow
      - name: Normalize file formats and active references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json, subprocess

          a=Path('assets')
          # Preserve the current high-quality static performance WebP before
          # normalizing the legacy .png-named source files.
          perf=a/'andrew-avatar-performance.png'
          with Image.open(perf) as im:
              assert im.format=='WEBP'
          (a/'andrew-avatar-performance.webp').write_bytes(perf.read_bytes())

          # These source/fallback paths are named PNG, so make them actual PNGs.
          png_paths=[
            a/'andrew-avatar-wave.png', a/'andrew-ai-idea.png',
            a/'andrew-avatar-performance.png', a/'andrew-avatar-performance-poster.png',
            a/'Andrew-performance-harp.PNG', a/'Andrew-performance singing.png'
          ]
          for p in png_paths:
              with Image.open(p) as im:
                  converted=im.convert('RGBA') if 'A' in im.getbands() else im.convert('RGB')
                  converted.save(p,'PNG',optimize=True)
          for p in png_paths:
              with Image.open(p) as im: assert im.format=='PNG', p

          # Active pages use WebP where available; PNG files remain proper fallbacks/sources.
          m=Path('mobile.html'); s=m.read_text()
          assert s.count('src="assets/andrew-avatar-performance.png"')==1
          s=s.replace('src="assets/andrew-avatar-performance.png"','src="assets/andrew-avatar-performance.webp"',1)
          assert 'andrew-avatar-performance-loop.webm' not in s
          m.write_text(s)

          w=Path('work/workroom.js'); s=w.read_text()
          assert s.count('i:"assets/andrew-ai-idea.png"')==1
          s=s.replace('i:"assets/andrew-ai-idea.png"','i:"assets/andrew-ai-idea.webp"',1)
          w.write_text(s)

          # Verify paired web formats and transparent greeting.
          for p in [a/'andrew-ai-idea.webp',a/'andrew-avatar-performance.webp',a/'andrew-performance-harp.webp',a/'andrew-performance-singing.webp']:
              with Image.open(p) as im: assert im.format=='WEBP', p
          with Image.open(a/'andrew-home-wave-transparent.png') as im:
              alpha=im.convert('RGBA').getchannel('A').getextrema()
              assert alpha==(0,255), alpha

          # Approved copy remains intact.
          assert 'I can take your<br/>vision and fantasies<br/>and make them a reality.' in Path('index.html').read_text()
          assert 'You bring me the songs, references, choreography, and moments you want to hit.' in Path('work/media/index.html').read_text()
          assert 'I redesigned Porch Stomp' in Path('work/workroom.js').read_text()

          # Andrew + Doon is byte-for-byte unchanged.
          doon={'assets/andrew-doon.webp':'3f32b01c0ec2e46290ac6cba7aa06abdd81d1dc2','assets/Andrew-doon.PNG':'421defed0be3f7fb4b97520e2b22a4123e233446'}
          for p,expected in doon.items():
              actual=subprocess.check_output(['git','hash-object',p],text=True).strip(); assert actual==expected,(p,actual)

          outputs=[
            'assets/andrew-home-wave-transparent.png','assets/andrew-home-wave.png','assets/andrew-avatar-wave.png',
            'assets/andrew-ai-idea.png','assets/andrew-ai-idea.webp',
            'assets/andrew-avatar-performance.png','assets/andrew-avatar-performance-poster.png','assets/andrew-avatar-performance.webp',
            'assets/Andrew-performance-harp.PNG','assets/andrew-performance-harp.webp',
            'assets/Andrew-performance singing.png','assets/andrew-performance-singing.webp'
          ]
          report={'checkpoint':2,'status':'complete','scope':'Avatar integration on review branch only','copy_base_commit':'2274762dbf6ea756e2c51f687887b24c1c264c86','ai_matte':'#ded6d4','mobile_music_static_avatar':True,'active_performance_asset':'assets/andrew-avatar-performance.webp','andrew_doon_unchanged':doon,'assets':{}}
          for p in outputs:
              q=Path(p)
              with Image.open(q) as im:
                  report['assets'][p]={'format':im.format,'dimensions':list(im.size),'bytes':q.stat().st_size,'sha256':hashlib.sha256(q.read_bytes()).hexdigest()}
          Path('_maintenance/checkpoint2-complete.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Verify and save checkpoint
        run: |
          set -e
          git diff --check
          grep -q 'andrew-avatar-performance.webp' mobile.html
          grep -q 'andrew-ai-idea.webp' work/workroom.js
          grep -q '#ded6d4' site-footer.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/andrew-avatar-wave.png assets/andrew-ai-idea.png assets/andrew-avatar-performance.png assets/andrew-avatar-performance-poster.png assets/andrew-avatar-performance.webp 'assets/Andrew-performance-harp.PNG' 'assets/Andrew-performance singing.png' mobile.html work/workroom.js _maintenance/checkpoint2-complete.json
          git commit -m 'Normalize refreshed avatar formats for review'
          git push origin HEAD:copy-clarity-20260916
