name: Hero polish update
on:
  push:
    branches: [hero-polish-20260917]
    paths:
      - '.github/workflows/hero-polish-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-polish-20260917
          fetch-depth: 1
      - name: Update headline and mobile music lab signal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          old = '<h1 id="heroTitle">I can take your<br/>vision and make it<br/>a reality.</h1>'
          new = '<h1 id="heroTitle">I can take<br/>your vision<br/>and make it a reality.</h1>'
          assert old in s, 'desktop headline source not found'
          index.write_text(s.replace(old, new, 1))

          mobile = Path('mobile.html')
          s = mobile.read_text()
          old = '<h1 id="mobileHeroTitle">I can take your<br>vision and make it<br>a reality.</h1>'
          new = '<h1 id="mobileHeroTitle">I can take<br>your vision<br>and make it a reality.</h1>'
          assert old in s, 'mobile headline source not found'
          mobile.write_text(s.replace(old, new, 1))

          css = Path('mobile-landing.css')
          s = css.read_text()
          old = '.mobile-hero-lab-launch .music-lab-signal { height: 32px; gap: 4px; }'
          new = '.mobile-hero-lab-launch .music-lab-signal { height: 32px; display: flex; align-items: center; justify-content: center; gap: 4px; }'
          assert old in s, 'mobile music lab signal source not found'
          css.write_text(s.replace(old, new, 1))
          PY
      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile.html mobile-landing.css
          git commit -m 'Refine hero headline and restore mobile music lab bars'
          git push origin HEAD:hero-polish-20260917
