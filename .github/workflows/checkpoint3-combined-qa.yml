name: Checkpoint 3 combined QA
on:
  push:
    branches: [copy-clarity-20260916]
    paths: ['.github/workflows/checkpoint3-combined-qa.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy-clarity-20260916
          fetch-depth: 0
      - name: Install browser QA tools
        run: |
          python3 -m pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium webkit
      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/checkpoint3-server.log 2>&1 &
          echo $! > /tmp/checkpoint3-server.pid
          sleep 2
      - name: Run combined copy and avatar QA
        run: |
          mkdir -p _qa/checkpoint3
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from playwright.sync_api import sync_playwright
          import subprocess, json, time

          ROOT='http://127.0.0.1:4173/'
          OUT=Path('_qa/checkpoint3')
          results=[]

          def ok(name, detail=''):
              results.append({'check':name,'status':'pass','detail':detail})

          def static_contains(path, *needles):
              text=Path(path).read_text()
              for needle in needles:
                  assert needle in text, f'{path} missing: {needle}'
              ok('static:'+path, f'{len(needles)} required strings present')

          # Static release invariants
          static_contains('index.html',
              'I can take your<br/>vision and fantasies<br/>and make them a reality.',
              'I design and build clearer websites',
              'I edit campaign videos and social content',
              'Check out my photo album.',
              'assets/andrew-home-wave-transparent.png')
          static_contains('mobile.html',
              'I can take your<br>vision and fantasies<br>and make them<br>a reality.',
              'assets/andrew-home-wave-transparent.png',
              'assets/andrew-avatar-performance.webp',
              'index.html?full=1#homeAboutTitle')
          static_contains('work/media/index.html',
              'You bring me the songs, references, choreography, and moments you want to hit.',
              'Audio services &amp; pricing')
          static_contains('work/workroom.js',
              'I redesigned Porch Stomp',
              'I edited campaign videos',
              'assets/andrew-ai-idea.webp')
          static_contains('site-footer.css', '#ded6d4')
          static_contains('services.html', '$500–$5,500+')

          # Static avatar file verification
          with Image.open('assets/andrew-home-wave-transparent.png') as im:
              assert 'A' in im.getbands(), im.mode
              lo,hi=im.getchannel('A').getextrema()
              assert lo == 0 and hi == 255, (lo,hi)
              ok('transparent-wave-alpha', f'{im.size[0]}x{im.size[1]}, alpha {lo}-{hi}')
          for asset in [
              'assets/andrew-ai-idea.webp','assets/andrew-avatar-performance.webp',
              'assets/andrew-performance-harp.webp','assets/andrew-performance-singing.webp']:
              with Image.open(asset) as im:
                  im.verify()
              ok('asset:'+asset)

          expected_doon={
              'assets/andrew-doon.webp':'3f32b01c0ec2e46290ac6cba7aa06abdd81d1dc2',
              'assets/Andrew-doon.PNG':'421defed0be3f7fb4b97520e2b22a4123e233446'}
          for path,sha in expected_doon.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==sha, f'{path} changed: {actual}'
              ok('unchanged:'+path,actual)

          def no_overflow(page, label):
              metrics=page.evaluate('''() => ({w: innerWidth, sw: document.documentElement.scrollWidth})''')
              assert metrics['sw'] <= metrics['w'] + 2, f'{label} horizontal overflow {metrics}'
              ok(label+':no-horizontal-overflow', str(metrics))

          def good_images(page, label):
              bad=page.evaluate('''() => [...document.images].filter(i => i.currentSrc && (!i.complete || i.naturalWidth===0)).map(i=>i.currentSrc)''')
              assert not bad, f'{label} broken images: {bad[:5]}'
              ok(label+':images-load')

          with sync_playwright() as p:
              engines={'chromium':p.chromium,'webkit':p.webkit}
              for engine_name, engine in engines.items():
                  browser=engine.launch()
                  for mode,viewport in [('desktop',{'width':1440,'height':900}),('mobile',{'width':390,'height':844})]:
                      context=browser.new_context(viewport=viewport, device_scale_factor=1)
                      page=context.new_page()
                      page_errors=[]
                      page.on('pageerror', lambda err, store=page_errors: store.append(str(err)))

                      # Desktop full homepage, mobile dedicated entry page
                      if mode=='desktop':
                          page.goto(ROOT+'index.html?full=1', wait_until='networkidle')
                          label=f'{engine_name}-{mode}-home'
                          assert page.locator('#heroGreeterImage').get_attribute('src').endswith('andrew-home-wave-transparent.png')
                          assert page.locator('#heroGreeterImage').evaluate('(i)=>i.naturalWidth>0')
                          assert page.locator('#homeAboutTitle').count()==1
                          no_overflow(page,label); good_images(page,label)
                          if engine_name=='chromium':
                              page.screenshot(path=str(OUT/'homepage-desktop.png'),full_page=True)
                              card=page.locator('.aw-avatar-matte').first
                              if card.count(): card.screenshot(path=str(OUT/'homepage-workflow-card.png'))
                      else:
                          page.goto(ROOT+'mobile.html?preview=1', wait_until='networkidle')
                          label=f'{engine_name}-{mode}-home'
                          wave=page.locator('.mobile-hero-greeter-avatar img')
                          assert wave.get_attribute('src').endswith('andrew-home-wave-transparent.png')
                          assert wave.evaluate('(i)=>i.naturalWidth>0')
                          more=page.locator('a.about-link')
                          assert '#homeAboutTitle' in more.get_attribute('href')
                          avatar=page.locator('.music-card > .music-card-avatar')
                          assert avatar.count()==1
                          assert avatar.get_attribute('src').endswith('andrew-avatar-performance.webp')
                          assert page.locator('.music-card > video').count()==0
                          no_overflow(page,label); good_images(page,label)
                          if engine_name=='chromium':
                              page.screenshot(path=str(OUT/'homepage-mobile.png'),full_page=True)
                              avatar.scroll_into_view_if_needed(); page.wait_for_timeout(250)
                              page.locator('.music-card').screenshot(path=str(OUT/'mobile-music-card.png'))

                      assert not page_errors, f'{label} JS errors: {page_errors}'

                      # Work index, switch to workflow preview and verify matte/image
                      page.goto(ROOT+'projects.html', wait_until='networkidle')
                      label=f'{engine_name}-{mode}-projects'
                      btn=page.locator('[data-work-preview="workflows"]')
                      assert btn.count()==1
                      btn.click(); page.wait_for_timeout(250)
                      proj=page.locator('#projectionImage')
                      assert proj.get_attribute('src').endswith('assets/andrew-ai-idea.webp')
                      assert proj.evaluate('(i)=>i.naturalWidth>0')
                      wrap=proj.locator('..')
                      assert 'is-avatar-preview' in (wrap.get_attribute('class') or '')
                      bg=wrap.evaluate('(e)=>getComputedStyle(e).backgroundColor')
                      assert bg in ('rgb(222, 214, 212)','rgba(222, 214, 212, 1)'), bg
                      no_overflow(page,label)
                      if engine_name=='chromium' and mode=='desktop':
                          page.locator('.projection').screenshot(path=str(OUT/'projects-workflow-preview.png'))

                      # Workflow page loads without layout errors
                      page.goto(ROOT+'work/workflows/', wait_until='networkidle')
                      label=f'{engine_name}-{mode}-workflows'
                      no_overflow(page,label); good_images(page,label)

                      # Media tabs still switch
                      page.goto(ROOT+'work/media/#audio', wait_until='networkidle')
                      label=f'{engine_name}-{mode}-media'
                      channels=page.locator('[data-media-channel]')
                      assert channels.count()>=3
                      for tab in ('video','live','audio'):
                          b=page.locator(f'[data-media-channel="{tab}"]')
                          b.click(); page.wait_for_timeout(120)
                          assert b.get_attribute('aria-selected')=='true'
                          panel=page.locator(f'[data-media-panel="{tab}"]')
                          assert not panel.is_hidden(), f'{tab} panel hidden'
                      no_overflow(page,label)

                      # Rooftop Ramblers supplied performance avatars
                      page.goto(ROOT+'projects/rooftop-ramblers.html', wait_until='networkidle')
                      label=f'{engine_name}-{mode}-rooftop'
                      sing=page.locator('img[src*="andrew-performance-singing"]')
                      harp=page.locator('img[src*="andrew-performance-harp"]')
                      assert sing.count()>=1 and harp.count()>=1
                      assert sing.first.evaluate('(i)=>i.naturalWidth>0')
                      assert harp.first.evaluate('(i)=>i.naturalWidth>0')
                      no_overflow(page,label); good_images(page,label)
                      if engine_name=='chromium' and mode=='desktop':
                          page.screenshot(path=str(OUT/'rooftop-avatars.png'),full_page=True)

                      # Services keeps approved pricing and destinations
                      page.goto(ROOT+'services.html', wait_until='networkidle')
                      label=f'{engine_name}-{mode}-services'
                      body=page.locator('body').inner_text()
                      assert '$500–$5,500+' in body
                      assert page.locator('#serviceWeb').count()==1
                      assert page.locator('#serviceAudio').count()==1
                      no_overflow(page,label)

                      # Remaining rewritten pages render and keep their service CTA language
                      checks=[
                          ('work/websites/','Website services & pricing'),
                          ('work/campaigns-content/','Social content services & pricing'),
                          ('work/nonprofits-programs/','Custom project services & pricing'),
                          ('projects/porch-stomp.html','Website services & pricing'),
                          ('projects/discovery-sound-garden.html','Custom project services & pricing'),
                          ('projects/yolele-ingredients.html','Website services & pricing'),
                          ('projects/edit-suite.html','Audio & video services & pricing')]
                      for rel,needle in checks:
                          page.goto(ROOT+rel,wait_until='domcontentloaded')
                          assert needle.lower() in page.locator('body').inner_text().lower(), f'{rel} missing {needle}'
                          no_overflow(page,f'{engine_name}-{mode}-{rel}')

                      context.close()
                  browser.close()

          report={
              'checkpoint':3,
              'status':'complete',
              'branch':'copy-clarity-20260916',
              'tested_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'engines':['chromium','webkit'],
              'viewports':{'mobile':'390x844','desktop':'1440x900'},
              'checks':results,
              'andrew_doon_unchanged':expected_doon,
              'screenshots':[p.name for p in OUT.glob('*.png')]
          }
          (OUT/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          Path('_maintenance/checkpoint3-complete.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'status':'complete','checks':len(results),'screenshots':report['screenshots']},indent=2))
          PY
      - name: Save checkpoint 3 report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _maintenance/checkpoint3-complete.json
          git diff --cached --quiet || git commit -m 'Complete combined copy and avatar QA checkpoint 3'
          git push origin HEAD:copy-clarity-20260916
      - name: Upload QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint3-combined-qa
          path: _qa/checkpoint3/
          retention-days: 7
