name: Verify published Services b023788
on:
  push:
    branches: [services-layout-20260916]
    paths: ['.github/workflows/services-live-b023788.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check live HTML, exact approved styles, prices and portrait
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          import hashlib, json, time
          expected = {'services.html':'437a4e1872f0b78ab58df7d4beaf806a5d01403c', 'services-page.css?v=20260916-services-v4':'5ec04348112eac0921b8f894b1ac0426e41f4f74'}
          def read(url):
              with urlopen(Request(url, headers={'User-Agent':'Portfolio-release-verification', 'Cache-Control':'no-cache'}),timeout=12) as r:
                  assert r.status == 200, (url,r.status)
                  return r.read()
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          last_error = None
          for attempt in range(24):
              try:
                  report={'production_commit':'b023788fa385dfc3a8cda872b4d72f282e539598','checks':[]}
                  for base in ['https://www.awolverton.com/','https://awolverton.com/']:
                      for path,wanted in expected.items():
                          url=urljoin(base,path)
                          data=read(url)
                          actual=blob(data)
                          assert actual == wanted, (url,actual,wanted)
                          report['checks'].append({'url':url,'matches_approved_blob':actual,'http_status':200})
                          if path=='services.html':
                              html=data.decode('utf-8')
                              assert '$500–$5,500+' in html and 'From $500' in html and 'From $5,500' in html
                              assert 'on-page and technical SEO setup' in html
                              assert 'services-page.css?v=20260916-services-v4' in html
                              assert 'Questions before you book.' in html
                              assert 'sp-process-steps' in html and 'sp-portrait-clip' in html
                              assert 'What kind of stuck' not in html and 'The toolbox is still bookable' not in html
                  portrait=read('https://www.awolverton.com/assets/andrew-doon.webp')
                  assert portrait[:4] == b'RIFF' and portrait[8:12] == b'WEBP'
                  report['portrait']={'http_status':200,'valid_webp_header':True,'bytes':len(portrait)}
                  report['status']='passed'
                  print(json.dumps(report,indent=2),flush=True)
                  break
              except Exception as e:
                  last_error=e
                  print('Waiting for public deployment:',repr(e),flush=True)
                  time.sleep(10)
          else:
              raise SystemExit('Public verification failed: '+repr(last_error))
          PY
