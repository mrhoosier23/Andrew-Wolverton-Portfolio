name: AI Schools mobile validation
on:
  push:
    branches: [portfolio-ui-review-20260915]
    paths: ['.github/workflows/portfolio-ui-review.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          node --check ai-schools-page.js
          python3 -c "s=open('portfolio-ui.css').read(); assert 'AI Schools mobile interaction deck' in s"
          python3 scripts/audit_site_links.py > /tmp/anchor-results.json
      - name: Install browser testing tools
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser regression checks
        run: python3 _maintenance/browser-ui.py
