name: Portfolio refinement validation
on:
  push:
    branches: [portfolio-ui-review-20260915]
    paths: ['.github/workflows/portfolio-ui-review.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden legacy Work redirects before assets load
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('projects.html')
          s=p.read_text()
          router='''<script data-legacy-work-router>(function(){function route(){var q=new URLSearchParams(location.search),h=location.hash.toLowerCase(),t="",project=q.get("project"),media=q.get("media"),focus=q.get("focus"),projects={"porch-stomp":"projects/porch-stomp.html","yolele":"projects/yolele-ingredients.html","dsg":"projects/discovery-sound-garden.html"};t=projects[project]||"";if(!t&&["audio","video","performance","live"].includes(media))t="work/media/#"+(media==="performance"?"live":media);if(!t&&focus==="live")t="work/media/#live";if(!t&&(focus==="ai"||h==="#ai"))t="work/workflows/";if(!t&&h==="#dsgdeepdive")t="projects/discovery-sound-garden.html";if(!t&&["#socialprojects","#social","#campaigns"].includes(h))t="work/campaigns-content/";if(!t&&["#websites","#websitework"].includes(h))t="work/websites/";if(!t&&["#media","#audio","#video","#performance","#live"].includes(h))t="work/media/#"+(h==="#performance"?"live":h==="#media"?"audio":h.slice(1));if(!t&&h==="#projects")t="projects.html";if(t){location.replace(t);return true}return false}route();addEventListener("hashchange",route);}());</script>'''
          if 'data-legacy-work-router' in s:
              s,n=re.subn(r'<script data-legacy-work-router>.*?</script>',router,s,count=1,flags=re.S)
              if n != 1: raise SystemExit('legacy router replacement failed')
          else:
              needle='<meta name="description" content="Andrew Wolverton\'s website, nonprofit, campaign, media, and workflow projects.">'
              if needle not in s: raise SystemExit('projects.html insertion point missing')
              s=s.replace(needle,needle+router,1)
          p.write_text(s)
          PY
      - name: Validate syntax and internal fragments
        run: |
          node --check work/workroom.js
          node --check work/media/audio-library.js
          mkdir -p _qa/reports
          python3 scripts/audit_site_links.py > _qa/reports/anchor-results.json
      - name: Save hardened redirect on review branch
        run: |
          if ! git diff --quiet -- projects.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add projects.html
            git commit -m 'Handle legacy Work routes on hash changes'
            git push origin HEAD:portfolio-ui-review-20260915
          fi
      - name: Install browser testing tools
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser regression checks
        run: python3 _maintenance/browser-ui.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-refinement-qa
          path: _qa/reports/
          retention-days: 2
