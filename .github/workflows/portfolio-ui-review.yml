name: Portfolio refinement validation
on:
  push:
    branches: [portfolio-ui-review-20260915]
    paths: ['.github/workflows/portfolio-ui-review.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply AI Schools mobile interaction deck
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('portfolio-ui.css')
          s=p.read_text()
          marker='/* AI Schools mobile interaction deck */'
          block=r'''

/* AI Schools mobile interaction deck */
@media(max-width:820px){
  .timeback-page .mobile-bar{grid-template-columns:1fr auto;min-height:58px;padding:7px 14px;gap:10px}
  .timeback-page .mobile-bar img{display:none}
  .timeback-page .mobile-bar span{font-size:18px}
  .timeback-page .mobile-bar b{padding:8px 11px;font-size:12px}
  .timeback-page .story-scene{scroll-margin-top:58px}
  .timeback-page .artifact-player{display:flex;flex-direction:column;overflow:visible;border-radius:22px;background:var(--paper)}
  .timeback-page .artifact-guide{order:1;position:sticky;top:58px;z-index:35;min-height:0;padding:10px 12px;background:rgba(6,60,51,.985);border-radius:20px 20px 0 0;box-shadow:0 10px 24px rgba(6,60,51,.18)}
  .timeback-page .artifact-guide .guide-label{display:none}
  .timeback-page .artifact-guide ol{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .timeback-page .artifact-guide li,.timeback-page .artifact-guide li:first-child{border:0}
  .timeback-page .artifact-guide button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;padding:7px 4px;border:1px solid rgba(255,255,255,.18);border-radius:11px;color:rgba(255,255,255,.72);text-align:center}
  .timeback-page .artifact-guide button span{grid-row:auto;padding:0;color:var(--gold);font-size:11px}
  .timeback-page .artifact-guide button b{font-size:14px;line-height:1.05}
  .timeback-page .artifact-guide button small{display:none}
  .timeback-page .artifact-guide li.is-active button{border-color:var(--aqua);background:var(--aqua);color:var(--deep)}
  .timeback-page .artifact-guide li.is-active button span,.timeback-page .artifact-guide li.is-active button b{color:var(--deep)}
  .timeback-page .artifact-guide .player-controls{display:none}
  .timeback-page .artifact-stage{order:2;padding:14px;background:#e9eee8}
  .timeback-page .artifact-stage-head{align-items:flex-start;gap:9px;margin-bottom:12px}
  .timeback-page .artifact-stage-head span{font-size:13px;white-space:nowrap}
  .timeback-page .artifact-stage-head strong{font-size:22px;line-height:1.05}
  .timeback-page .artifact-stage img{aspect-ratio:auto;height:auto;max-height:52dvh;object-fit:contain;background:#fff}
  .timeback-page .artifact-stage figcaption{min-height:0;padding:13px 15px;font-size:14px;line-height:1.42}
  .timeback-page .lab-player{display:flex;flex-direction:column;overflow:visible;border-radius:22px;background:var(--paper)}
  .timeback-page .lab-progress{order:1;border-radius:22px 22px 0 0;overflow:hidden}
  .timeback-page .lab-controls{order:2;position:sticky;top:58px;z-index:34;grid-template-columns:minmax(72px,.8fr) auto minmax(128px,1.35fr);gap:8px;margin:0;padding:9px 10px;border-top:0;border-bottom:1px solid var(--line);background:rgba(255,250,241,.985);box-shadow:0 9px 20px rgba(29,42,39,.11)}
  .timeback-page .lab-controls>div{grid-column:auto;grid-row:auto;align-items:center;gap:5px}
  .timeback-page .lab-controls b{width:7px;height:7px}
  .timeback-page .lab-controls b.is-current{width:22px}
  .timeback-page .lab-controls button{min-height:42px;padding:8px 9px;font-size:14px;line-height:1.05}
  .timeback-page .lab-stage{order:3;display:flex;flex-direction:column;min-height:0}
  .timeback-page .lab-stage-copy{padding:20px 18px 18px}
  .timeback-page .lab-stage-copy>span{font-size:12px}
  .timeback-page .lab-stage-copy>p[data-lab-count]{margin-top:9px;font-size:16px}
  .timeback-page .lab-stage-copy h3{margin-top:10px;font-size:clamp(36px,10.6vw,46px);line-height:.96}
  .timeback-page .lab-stage-copy>p[data-lab-copy]{margin-top:12px;font-size:16px;line-height:1.45}
  .timeback-page .lab-takeaway{margin-top:15px;padding:13px 14px}
  .timeback-page .lab-takeaway strong{font-size:14px;line-height:1.35}
  .timeback-page .lab-stage-visual{min-height:0;padding:18px}
  .timeback-page .lab-stage-visual img{width:100%;height:auto;max-height:230px;object-fit:contain}
  .timeback-page .quiz-shell{overflow:visible}
  .timeback-page .quiz-topline{position:sticky;top:58px;z-index:33;background:rgba(255,250,241,.985);box-shadow:0 8px 18px rgba(29,42,39,.08)}
  .timeback-page .quiz-visual{min-height:250px}
}
@media(max-width:540px){
  .timeback-page .story-scene{padding:44px 16px}
  .timeback-page .artifact-stage{padding:12px}
  .timeback-page .artifact-guide{padding:9px 8px}
  .timeback-page .artifact-guide button{min-height:54px}
  .timeback-page .lab-controls{grid-template-columns:70px auto minmax(120px,1.25fr)}
  .timeback-page .lab-stage-visual{padding:14px 16px 18px}
}
'''
          if marker not in s:
              p.write_text(s+block)
          PY
      - name: Validate syntax and internal fragments
        run: |
          node --check ai-schools-page.js
          node --check work/workroom.js
          node --check work/media/audio-library.js
          mkdir -p _qa/reports
          python3 scripts/audit_site_links.py > _qa/reports/anchor-results.json
      - name: Save review CSS
        run: |
          if ! git diff --quiet -- portfolio-ui.css; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add portfolio-ui.css
            git commit -m 'Redesign AI Schools mobile step interactions'
            git push origin HEAD:portfolio-ui-review-20260915
          fi
      - name: Install browser testing tools
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser regression checks
        run: python3 _maintenance/browser-ui.py
      - name: AI Schools mobile interaction checks
        run: |
          python3 - <<'PY'
          import asyncio,functools,http.server,threading
          from pathlib import Path
          from playwright.async_api import async_playwright
          root=Path.cwd(); out=root/'_qa/reports'; out.mkdir(parents=True,exist_ok=True)
          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8766),functools.partial(Quiet,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          async def main():
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch(headless=True)
                  context=await browser.new_context(viewport={'width':390,'height':844},reduced_motion='reduce')
                  page=await context.new_page()
                  await page.goto('http://127.0.0.1:8766/ai-schools.html',wait_until='domcontentloaded')
                  await page.locator('#artifactPlayer').scroll_into_view_if_needed(); await page.wait_for_timeout(250)
                  artifact=await page.evaluate('''() => {const g=document.querySelector('.artifact-guide'),i=document.querySelector('.artifact-stage img');const s=getComputedStyle(g);return {position:s.position,top:s.top,controls:getComputedStyle(document.querySelector('.artifact-guide .player-controls')).display,guideTop:g.getBoundingClientRect().top,imgHeight:i.getBoundingClientRect().height,overflow:document.documentElement.scrollWidth-innerWidth}}''')
                  assert artifact['position']=='sticky' and artifact['controls']=='none' and artifact['overflow']<=1,artifact
                  await page.locator('[data-artifact-marker="2"] button').click(); await page.wait_for_timeout(100)
                  assert 'Review the first result' in await page.locator('[data-artifact-title]').inner_text()
                  await page.screenshot(path=str(out/'ai-schools-artifact-mobile.png'),full_page=False)
                  await page.locator('#labPlayer').scroll_into_view_if_needed(); await page.wait_for_timeout(250)
                  lab=await page.evaluate('''() => {const c=document.querySelector('.lab-controls'),v=document.querySelector('.lab-stage-visual img');return {position:getComputedStyle(c).position,top:getComputedStyle(c).top,controlTop:c.getBoundingClientRect().top,imgHeight:v.getBoundingClientRect().height,overflow:document.documentElement.scrollWidth-innerWidth}}''')
                  assert lab['position']=='sticky' and lab['imgHeight']<=232 and lab['overflow']<=1,lab
                  await page.locator('[data-lab-next]').click(); await page.wait_for_timeout(100)
                  assert 'Choose one task worth getting back' in await page.locator('[data-lab-title]').inner_text()
                  await page.screenshot(path=str(out/'ai-schools-lab-mobile.png'),full_page=False)
                  await browser.close()
          asyncio.run(main()); server.shutdown()
          PY
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-refinement-qa
          path: _qa/reports/
          retention-days: 2
