name: AI Schools image viewer validation
on:
  push:
    branches:
      - portfolio-ui-review-20260915
    paths:
      - .github/workflows/portfolio-ui-review.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 _maintenance/apply-ai-image-viewer.py
      - name: Check JavaScript
        run: node --check ai-schools-page.js
      - name: Save review changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-schools.html ai-schools-page.js ai-schools.css
          git commit -m 'Add AI Schools image viewer and repair Andrew photo'
          git push origin HEAD:portfolio-ui-review-20260915
      - name: Install Playwright
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Run existing regression checks
        run: python3 _maintenance/browser-ui.py
      - name: Run image viewer QA
        run: python3 _maintenance/qa-ai-image-viewer.py
