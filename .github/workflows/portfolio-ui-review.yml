name: Portfolio refinement validation
on:
  push:
    branches: [portfolio-ui-review-20260915]
    paths: ['_maintenance/apply-ui.py', '.github/workflows/portfolio-ui-review.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded source refinements
        run: python3 _maintenance/apply-ui.py
      - name: Validate syntax and internal fragments
        run: |
          node --check work/workroom.js
          node --check work/media/audio-library.js
          mkdir -p _qa/reports
          python3 scripts/audit_site_links.py > _qa/reports/anchor-results.json
      - name: Save only on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json,subprocess
          paths=json.load(open('_maintenance/publication-paths.json'))+['_maintenance/publication-paths.json']
          subprocess.run(['git','add','--']+paths,check=True)
          subprocess.run(['git','commit','-m','Refine portfolio anchors, compact CTAs, and visible website and social collections'],check=True)
          subprocess.run(['git','push','origin','HEAD:portfolio-ui-review-20260915'],check=True)
          print(subprocess.check_output(['git','ls-tree','-r','HEAD','--']+paths).decode())
          PY
      - name: Install browser testing tools
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser regression checks
        run: python3 _maintenance/browser-ui.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-refinement-qa
          path: _qa/reports/
          retention-days: 2
