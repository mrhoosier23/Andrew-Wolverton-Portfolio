<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" role="img" aria-labelledby="title desc">
<title id="title">Andrew's iPod</title><desc id="desc">A white iPod with a music screen, click wheel, and aqua hologram glow.</desc>
<defs>
 <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffef9"/><stop offset=".55" stop-color="#ecece8"/><stop offset="1" stop-color="#cfd3cf"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c9e7dc"/><stop offset="1" stop-color="#8eb8aa"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#73f4e4" stop-opacity=".7"/><stop offset=".48" stop-color="#40dcd8" stop-opacity=".22"/><stop offset="1" stop-color="#40dcd8" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#001b16" flood-opacity=".42"/></filter>
</defs>
<ellipse cx="210" cy="560" rx="190" ry="55" fill="url(#glow)"/>
<path d="M115 565 L175 390 L245 390 L305 565 Z" fill="#62e7df" opacity=".12"/>
<g filter="url(#shadow)">
 <rect x="72" y="30" width="276" height="520" rx="42" fill="url(#body)" stroke="#fdfdf9" stroke-width="7"/>
 <rect x="102" y="76" width="216" height="162" rx="18" fill="url(#screen)" stroke="#6b8279" stroke-width="4"/>
 <text x="128" y="116" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f35">ANDREW'S MUSIC</text>
 <line x1="124" y1="134" x2="296" y2="134" stroke="#456d60" stroke-width="2"/>
 <text x="128" y="171" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#102f28">PLAY</text>
 <text x="128" y="204" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#345f53">3 SONGS</text>
 <circle cx="210" cy="381" r="112" fill="#f7f7f2" stroke="#c7cac6" stroke-width="5"/>
 <circle cx="210" cy="381" r="44" fill="#e3e5e1" stroke="#c5c9c4" stroke-width="4"/>
 <text x="210" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#6d7370">MENU</text>
