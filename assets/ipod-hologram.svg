 <path d="M252 381h31" stroke="#777d7a" stroke-width="8" stroke-linecap="round"/><path d="M252 369l15 12-15 12" fill="none" stroke="#777d7a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M203 447l22 13-22 13z" fill="#777d7a"/>
</g>
