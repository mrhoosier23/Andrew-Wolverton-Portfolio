<section aria-labelledby="contactTitle" class="aw-site-contact" data-site-contact id="contact"><div class="sf-wrap sf-contact-layout"><div class="sf-contact-copy"><p class="sf-kicker">Get in touch</p><h2 id="contactTitle">Tell me about<br/>your project.</h2><p>Send the service, deadline, and budget you have in mind. A rough outline is enough.</p><div class="sf-contact-person"><figure class="sf-portrait"><div class="sf-portrait-clip"><img alt="Stylized portrait of Andrew standing beside Doon" height="1610" loading="lazy" onerror="this.onerror=null;this.src='{{ROOT}}assets/Andrew-doon.PNG';" src="{{ROOT}}assets/andrew-doon.webp" width="977"/></div></figure><div><strong>Andrew Wolverton</strong><span>Brooklyn, New York</span><a class="sf-button" href="mailto:hello@awolverton.com">Email Andrew</a></div></div></div><form action="https://formsubmit.co/ajax/anwolver@gmail.com" class="sf-contact-form" data-site-contact-form id="contactForm" method="POST">
<input name="_subject" type="hidden" value="New portfolio inquiry"/>
<input name="_template" type="hidden" value="table"/>
<input aria-hidden="true" autocomplete="off" class="honeypot" name="_honey" tabindex="-1" type="text"/>
<label><span>Name</span><input autocomplete="name" name="name" required="" type="text"/></label>
<label><span>Email</span><input autocomplete="email" name="email" required="" type="email"/></label>
<label><span>Organization</span><input autocomplete="organization" name="organization" type="text"/></label>
<label><span>Project type</span><input id="contactProjectType" list="serviceOptions" name="projectType" placeholder="Choose a service or describe your project" type="text"/><datalist id="serviceOptions"><option value="Websites"></option><option value="Social content"></option><option value="Audio editing &amp; dance mixes"></option><option value="Video editing"></option><option value="Live music"></option><option value="NYC research &amp; scouting"></option><option value="AI &amp; workflow systems"></option><option value="Project review &amp; fixes"></option><option value="Custom project build"></option><option value="Ongoing creative support"></option><option value="Schools &amp; education"></option><option value="Not sure yet"></option></datalist></label>
<div class="form-row">
<label><span>Approximate budget</span><select name="budget"><option value="Not sure yet">Not sure yet</option><option value="Under $100">Under $100</option><option value="$100 to $500">$100 to $500</option><option value="$500 to $1,500">$500 to $1,500</option><option value="$1,500 to $4,000">$1,500 to $4,000</option><option value="$4,000 to $8,000">$4,000 to $8,000</option><option value="$8,000+">$8,000+</option></select></label>
<label><span>Desired timing</span><input name="timing" placeholder="Example: October launch" type="text"/></label>
</div>
<label><span>Tell me about your project</span><textarea name="message" placeholder="What do you need, who is it for, and when do you need it?" required="" rows="6"></textarea></label>
<button class="sf-button sf-button-primary" type="submit">Send inquiry</button>
<p aria-live="polite" class="form-note" id="contactFormNote">Your inquiry goes directly to Andrew.</p>
</form></div></section>
